old2);font-weight:750;margin-top:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{padding:8px 12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px}.tabs button.active{border-color:var(--gold);color:var(--gold2)}.note-card{padding:13px;border:1px solid var(--line);border-radius:9px;background:#101a23;margin:9px 0}.note-card p{white-space:pre-wrap;margin:7px 0;color:#cbd5dc}.footer{margin-top:35px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:#80909c}.mobile-nav{display:none}

<script>
const categories=[
{ id:"components",name:"Components & Mechanical Systems",icon:"⚙",desc:"The parts that make machinery run.",topics:["Rolling element bearings","Gears and gearboxes","Shafts and mechanical fits","Seals and gaskets"]},
{ id:"workshop",name:"Workshop Processes",icon:"🛠",desc:"Machining, fitting and workshop methods.",topics:["Measuring and marking out","Cutting and material preparation","Drilling and hole making","Threading operations","Grinding and finishing","Filing and hand fitting","Centre lathe operations","Milling operations","Turning between centres","Facing and boring","Knurling","Parting off","Machining threads"]},
{ id:"metrology",name:"Measuring & Metrology",icon:"📏",desc:"Measuring tools, accuracy and inspection.",topics:["Metrology","Limits, fits and tolerances","Dial indicators and measurement"]},
{ id:"drawings",name:"Engineering Drawings & Schematics",icon:"📐",desc:"Read drawings and follow fluid power circuits.",topics:["Engineering drawing interpretation","Hydraulic schematics and legends","Pneumatic schematics and legends"]},
{ id:"materials",name:"Materials & Specifications",icon:"🔩",desc:"Understand materials, grades and properties.",topics:["Engineering materials","Heat treatment basics","Material identification"]},
{ id:"maintenance",name:"Mechanical Maintenance",icon:"🔧",desc:"Inspect, maintain and fault-find equipment.",topics:["Mechanical failure analysis","Lubrication and contamination","Alignment and vibration"]},
{ id:"hydraulics",name:"Hydraulic Systems",icon:"💧",desc:"Oil under pressure, from pump to actuator.",topics:["Hydraulic system fundamentals","Pumps and hydraulic motors","Cylinders and actuators","Directional control valves","Pressure and flow control valves","Accumulators, filters and contamination","Hydraulic hoses, pipes and fittings","Hydraulic fault finding"]},
{ id:"pneumatics",name:"Pneumatic Systems",icon:"🌬",desc:"Compressed air systems and controls.",topics:["Pneumatic system fundamentals","Compressors and air receivers","Air preparation units","Directional control valves","Pneumatic cylinders and actuators","Solenoid and pilot-operated valves","Tubing, fittings and silencers","Pneumatic fault finding"]},
{ id:"formulas",name:"Formulas & Calculations",icon:"∑",desc:"Useful calculations for the workshop.",topics:["Cutting speed and spindle RPM","Tap drill selection","Hydraulic force and pressure","Pneumatic cylinder force"]},
{ id:"glossary",name:"Technical Knowledge & Glossary",icon:"▣",desc:"Trade terms, symbols and quick references.",topics:["Thread forms and designations","Fasteners and grades","Engineering terminology"]}
];
const workshopDisclaimer="This information is a general guide to workshop processes. It does not replace your workplace procedures or training. Always check and follow the current, up-to-date workshop or site SOP (Standard Operating Procedure), SSW (Safe Work Statement) or JSA (Job Safety Analysis) before starting work. If you're unsure about a task, machine, tool or process, stop and check with your supervisor before proceeding.";
const workshopArticles={
"Measuring and marking out":{
cat:"Workshop Processes",intro:"How to get dimensions from the drawing onto the material before cutting, drilling or machining.",quick:["Measure twice, mark once.","Choose a measuring tool suited to the accuracy required.","Keep reference faces clean and free from burrs.","Work from a known datum, not a random edge.","Check drawing revision, units, dimensions and tolerances before starting."],basics:[["What is it?","Measuring and marking out is transferring dimensions from a drawing or job specification onto a piece of material."],["What does it do?","It gives you clear reference points for cutting, drilling, machining and fitting. Accurate layout helps keep holes in position and components within the required dimensions."],["How does it work?","You identify the drawing dimensions and datums, measure the material, then mark the required lines and positions with suitable tools. Accuracy depends on the tool, setup, material condition and the way the measurement is taken."],["Where is it used?","Across fitting, machining, fabrication and maintenance workshops, from cutting stock to setting out mounting plates and replacement parts."]],types:"Linear measurement checks length, width, thickness, diameter or depth. Angular measurement checks or marks angles. Direct measurement uses a tool such as a rule, caliper or micrometer. Comparative measurement checks a part against a reference, often using an indicator or gauge. Marking out transfers the required geometry onto the workpiece.",tools:"Common tools include steel rules, vernier or digital calipers, outside micrometers, engineers' squares, scribers, centre punches, dividers, trammels, protractors, bevel squares, surface plates and height gauges. Each has a job. A steel rule is not a substitute for a micrometer when a close tolerance is involved.",materials:"Clean the material and remove loose dirt, oil and scale where appropriate. Check edges for burrs or damage. Identify a suitable datum face or edge. Marking blue can help make scribed lines easier to see. Do not assume a rolled or cut edge is straight, square or suitable as a datum until checked.",process:"1. Check the latest drawing or job specification. 2. Confirm material size and finished dimensions. 3. Identify a suitable datum face or edge. 4. Check measuring tools are suitable and in serviceable condition. 5. Measure and mark the required dimensions. 6. Recheck critical dimensions from the datum. 7. Confirm hole centres, edge distances and machining allowances before cutting or drilling. Have the layout checked where the job or site procedure requires it.",faults:"Measuring from an uneven edge can put every mark out. Dirt or burrs between measuring faces affect readings. A damaged or poorly zeroed instrument can give false measurements. Confusing radius and diameter, mixing units, using an obsolete drawing revision or measuring from several unrelated reference points can all lead to scrap. Heavy centre punching can deform thin material.",tips:"Use one datum wherever practical. Check instrument zero before measuring. Use the micrometer ratchet or friction device where fitted rather than squeezing harder. Avoid measuring hot components unless temperature is accounted for. If a reading doesn't make sense, repeat it with a suitable independent method. A scribed line does not replace a specified tolerance.",related:"Cutting and material preparation; drilling and hole making; machining; engineering drawing interpretation; metrology; limits, fits and tolerances.",technical:"Useful diagrams: datum face and datum edge; correct outside micrometer technique; caliper external, internal and depth measurement; marking a hole centre from two datums; height gauge on a surface plate. ISO 3611 covers external micrometers and ISO 13385-1 covers callipers. Confirm the applicable Australian adoption and current edition before publishing formal compliance references."},
"Cutting and material preparation":{
cat:"Workshop Processes",intro:"Preparing raw material to the size and condition needed for machining, fitting or fabrication.",quick:["Identify the material before choosing the cutting method.","Allow enough material for machining or finishing.","Secure and support the workpiece properly.","Use a blade, wheel or process suitable for the material and machine.","Check cut length, squareness, burrs, damage and distortion."],basics:[["What is it?","Cutting and material preparation is reducing raw material to the size or shape needed for the job."],["What does it do?","It gets bar, plate, pipe, tube or section ready for machining, fitting, fabrication or assembly. A good cut saves time. A poor one creates extra work or can make the material unusable."],["How does it work?","The workpiece is supported and cut using a suitable mechanical or thermal process. The method depends on material, thickness, shape, required accuracy, finish and available equipment."],["Where is it used?","Stock preparation, replacement-part manufacture, repair work, fabrication, pipework and general workshop maintenance."]],types:"Hacksawing is a manual method for smaller sections and general jobs. Bandsawing uses a continuous toothed blade and is common for bar, tube and sections. Abrasive cutting uses a compatible abrasive wheel. Oxy-fuel cutting heats suitable steel and uses an oxygen jet to oxidise and remove the material. Plasma cutting uses an electrically conductive plasma arc to cut electrically conductive materials. Cold cutting is a broad term for mechanical methods that avoid thermal cutting, including sawing and shearing.",tools:"Equipment can include hand hacksaws, horizontal or vertical bandsaws, abrasive cut-off saws, shears, oxy-fuel cutting equipment and plasma cutters. Select equipment and consumables for the actual material and task. Check machine guarding, wheel or blade compatibility and manufacturer's instructions.",materials:"Carbon steel can be cut by several mechanical and thermal methods. Stainless steel can be cut mechanically or by suitable thermal processes, with heat input and contamination considered. Aluminium needs suitable tooling to avoid loading. Cast iron and non-ferrous alloys require methods suited to their grade and section. Never assume similar-looking materials can be cut the same way.",process:"1. Check the drawing, job requirements and material identification. 2. Confirm finished size and machining allowance. 3. Select a suitable cutting method and compatible tooling. 4. Inspect the equipment and consumable. 5. Secure and support the material. 6. Follow the current machine and site procedure. 7. Inspect the cut for size, squareness, burrs, damage and distortion. 8. Mark the material for the next operation if needed. This is a process overview, not machine operating instructions.",faults:"Wrong blade or wheel selection can cause poor cutting or equipment damage. Poor workholding can let the material move. Cutting without allowance can leave the part undersize. Excessive heat input can distort material or affect its properties. Forcing a cut can damage tooling. An unsupported offcut can fall or jam the blade.",tips:"Keep enough material for finishing. Check that the offcut is supported. Deburr before measuring or handling further. Cutting and grinding discs are not interchangeable. Keep sparks and hot material clear of people, combustible materials and vulnerable equipment. After thermal cutting, inspect for distortion and heat-affected areas where they matter to the job.",related:"Measuring and marking out; drilling and hole making; grinding and finishing; machining; heating and joining; drawing interpretation.",technical:"Useful diagrams: bandsaw blade arrangement; abrasive wheel markings; oxy-fuel and plasma cutting principles; cutting allowance; common cut-edge defects. AS/NZS 4024 is a key machinery safety series, but the applicable requirements depend on the machine and task. Follow the machine and consumable manufacturer's information and current site procedures."},
"Drilling and hole making":{
cat:"Workshop Processes",intro:"Producing and finishing holes for fasteners, pins, threads and component features.",quick:["Confirm hole diameter, position, depth and tolerance from the drawing.","Identify the material and select suitable tooling.","Secure the workpiece. Never hold a loose job by hand.","Use suitable cutting conditions and fluid where required.","A drill's marked size does not guarantee the finished hole size.","A reamer needs a correctly prepared hole first."],basics:[["What is it?","Drilling is a machining process that produces a round hole using a rotating drill. Hole making also includes operations such as spotting, countersinking, counterboring, reaming and boring."],["What does it do?","It makes holes for bolts, pins, dowels, tapped threads, oil passages, locating features and assembly points."],["How does it work?","The drill rotates and feeds into the material. Its cutting edges remove material and the flutes help carry chips out. Tool geometry, speed, feed, workholding and chip removal all affect the result."],["Where is it used?","General fitting, machining, fabrication, maintenance and manufacturing, including mounting holes, tapped holes and precision bores."]],types:"Twist drilling produces a hole with a conventional fluted drill. Centre drilling makes a centre hole, often for lathe work between centres. Spot drilling creates a short starting feature for a subsequent drill. Countersinking makes a conical recess. Counterboring makes a flat-bottomed cylindrical recess. Reaming finishes a prepared hole to improve size accuracy and surface finish. Boring enlarges or corrects an existing hole using a single-point tool.",tools:"Tools and equipment include HSS or other suitable twist drills, centre drills, spot drills, drill presses, machine vices and clamps, reamers, countersinks, counterbores, boring tools, tapping attachments, depth stops and cutting-fluid equipment. Match tool geometry and material to the work.",materials:"Mild steel is commonly drilled with suitable HSS or other appropriate drills. Stainless steel can work-harden if the tool rubs. Aluminium can load onto cutting edges. Cast iron is often drilled without conventional cutting fluid, subject to tooling guidance. Hardened materials may need specialist tooling. Check material identification, thickness, hole type and finish requirements before starting.",process:"1. Check the drawing and hole requirements. 2. Confirm material and tooling. 3. Mark the position from the correct datum. 4. Use a suitable spotting or centre-drilling method where required. 5. Secure the workpiece and check the setup. 6. Follow machine and tooling instructions. 7. Manage chips and hole depth safely. 8. Deburr where specified. 9. Inspect diameter, position, depth and condition.",faults:"A blunt drill can generate heat and cut poorly. Incorrect geometry or cutting conditions can cause chatter, poor finish or tool damage. A moving workpiece can produce an inaccurate hole. Poor chip removal can jam flutes. An incorrect pre-ream hole can prevent the reamer achieving the required result. Excessive countersinking can leave a fastener sitting too deep.",tips:"A drill that rubs instead of cutting will heat up and wear quickly. Don't force it. Watch for chip build-up and follow the approved method for clearing chips. Be aware of grabbing as a drill breaks through thin material. Never hold rotating work by hand. Use the correct measuring method to check the finished hole. For fitted pins or bearing-related bores, work to the specified tolerance, not just the nominal diameter.",related:"Measuring and marking out; threading; machining; grinding and finishing; drawing interpretation; limits, fits and tolerances.",technical:"Useful diagrams: twist drill geometry; centre drill versus spot drill; through and blind holes; countersink versus counterbore; drilling and reaming sequence; common hole defects. ISO 235 covers specified twist drill dimensions for relevant drill series. ISO 2306 gives recommended tapping drill diameters. Confirm current editions and Australian adoption before publishing size tables."},
"Threading operations":{
cat:"Workshop Processes",intro:"Cutting, forming, identifying and repairing internal and external threads.",quick:["Identify the complete thread form before selecting a tap, die or fastener.","Check nominal diameter, pitch, hand and tolerance/class.","Metric, BSP, BSW, BSF, UNC and UNF are different systems.","Keep a tap square to the hole when starting.","Blind holes need room for the tap lead and chips.","Do not force a tap. Small taps can break with little warning."],basics:[["What is it?","Threading produces a helical groove on the inside or outside of a component. Internal threads are inside a hole; external threads are around a shaft, stud or bolt."],["What does it do?","Threads fasten components, allow adjustment and provide connections for mechanical, hydraulic and pneumatic equipment."],["How does it work?","A cutting tool removes material along a controlled path, or a forming process displaces material to create the thread profile. Taps make internal threads; dies and single-point tools can make external threads."],["Where is it used?","Fasteners, studs, threaded rods, pipe fittings, adjustment screws, plugs, covers and mechanical assemblies."]],types:"Hand tapping uses a tap and wrench. Machine tapping uses a suitable powered setup. Die threading cuts external threads. Single-point threading uses a lathe tool following a controlled path. Thread forming and rolling displace material rather than cutting it. Thread repair may involve chasing, an approved insert system or remanufacture, depending on the component.",tools:"Common tools include hand and machine taps, tap wrenches, dies and die stocks, thread pitch gauges, thread plug and ring gauges, single-point threading tools, thread micrometers, thread files, tapping charts and suitable cutting fluids. A pitch gauge helps identify pitch but does not by itself prove the full thread designation.",materials:"Tooling and cutting conditions depend on the material. Stainless steel can work-harden; aluminium can stick to cutting edges; cast iron can produce abrasive chips. Before threading, identify the thread standard, diameter, pitch, direction, tolerance class, material and whether the hole is blind or through. Select blank and tapping-drill sizes from a verified chart or specification.",process:"For an internal thread: confirm the designation; select the tapping drill from a verified source; prepare the hole to the required size and depth; prepare the entrance if required; align the tap; follow tap-maker and site instructions; manage chips as required for the tap and hole; clean and inspect with the specified method. For an external thread: confirm the specification and length; prepare the blank diameter and end; align the die or lathe tool; cut using the approved setup; clean and inspect the thread.",faults:"A mismatched thread can damage both parts. An incorrect tapping drill can produce a weak or difficult thread. A crooked start creates misalignment. Worn tooling gives a poor profile. Excessive force can break a tap. Chips packed in a blind hole can jam the tool. Incorrect thread length or sealing assumptions can cause assembly or leakage problems.",tips:"Clean an existing thread before identifying it. Use a pitch gauge, then confirm the full designation. Do not mix metric and imperial fasteners. BSPP and BSPT differ in form and sealing arrangement; some connections seal on a face or washer rather than the thread. A nut running onto a bolt is not a proper inspection. Use the specified thread gauges for critical work. A thread chaser may be more suitable than a cutting tap for cleaning an existing thread.",related:"Drilling and hole making; measuring and marking out; machining; drawing interpretation; fasteners; limits, fits and tolerances.",technical:"Useful diagrams: internal and external threads; major, minor and pitch diameters; pitch and flank angle; metric coarse and fine; BSPP versus BSPT; BSW, BSF, UNC and UNF; blind-hole depth; plug and ring gauge checks. AS 1275 relates to metric screw threads for fasteners. ISO 261/262 cover general-purpose metric thread series and selected sizes; ISO 965 covers metric thread tolerances. Verify current Australian editions and scope."},
"Grinding and finishing":{
cat:"Workshop Processes",intro:"Removing material with abrasives and preparing surfaces to the required finish.",quick:["Select an abrasive suitable for the material and operation.","Check the product rating against the machine speed.","Inspect wheels and discs before use. Do not use damaged products.","Keep guards in place and use the approved setup.","Do not side-load a wheel unless it is designed for that use.","Watch heat build-up, especially on thin or precision components."],basics:[["What is it?","Grinding is an abrasive machining process. Abrasive grains on a wheel, disc or belt remove small amounts of material. Finishing covers broader processes used to smooth, deburr, blend or prepare a surface."],["What does it do?","It removes excess material, cleans up edges, removes burrs, prepares surfaces for coating or joining and can achieve specified dimensions or surface finishes."],["How does it work?","Abrasive particles contact the workpiece and cut or wear away small amounts of material. The abrasive type, bond, grade, machine and operating conditions affect the result."],["Where is it used?","General fitting and maintenance, toolrooms, machining, weld preparation, surface preparation and precision grinding."]],types:"Bench grinding uses a fixed abrasive wheel for suitable general tasks. Angle grinding uses a portable grinder with compatible accessories. Surface grinding produces flat precision surfaces. Cylindrical grinding finishes external or internal cylindrical surfaces. Belt grinding and linishing use abrasive belts for material removal and blending. Polishing improves surface appearance or finish but does not automatically achieve dimensional accuracy.",tools:"Equipment includes bench grinders, angle grinders, surface grinders, cylindrical grinders, belt linishers, dressing tools and suitable measuring instruments. Abrasive products include bonded wheels, cutting and grinding discs, flap discs and belts. These products are not interchangeable; check the marked application and machine compatibility.",materials:"Abrasive selection depends on material and task. Aluminium oxide is widely used on many ferrous metals. Silicon carbide is used for selected non-ferrous and non-metallic materials. Zirconia alumina and ceramic alumina are used in suitable higher-performance products. These are general examples only; follow the abrasive manufacturer's selection information.",process:"1. Check the job requirements, material and required finish. 2. Select the grinding or finishing process. 3. Check abrasive product and machine compatibility, including speed rating. 4. Inspect equipment and work area. 5. Secure or support the workpiece using the approved setup. 6. Follow machine instructions and site procedure. 7. Monitor material removal, heat and surface condition. 8. Inspect and measure the finished part. 9. Clean the area using the approved method.",faults:"Wrong abrasive selection can cut poorly or wear quickly. A damaged or unsuitable wheel can fail. Incorrect machine speed can be dangerous. Excessive pressure creates heat and poor finish. Poor wheel dressing affects performance. Side-loading an unsuitable wheel can damage it. Removing too much material leaves the component undersize.",tips:"Never assume a wheel or disc fits every grinder. Check the maximum operating speed against the machine. Do not use a wheel that has been dropped, cracked or damaged. A ring test is only appropriate for wheel types and situations where the manufacturer specifies it; it is not universal. Do not force the work into the abrasive. Check dimensions during precision work and manage sparks, dust, noise and heat under site requirements.",related:"Cutting and material preparation; filing and hand fitting; machining; measuring and marking out; heating and joining; materials and specifications.",technical:"Useful diagrams: abrasive wheel construction and markings; common abrasive types; cutting versus grinding versus flap discs; surface grinding arrangement; grinding burns and surface defects. Do not publish a universal wheel speed, mounting method or inspection interval. Use the actual product and machine documentation and current workplace requirements."},
"Filing and hand fitting":{
cat:"Workshop Processes",intro:"Manual material removal and careful adjustment of components to achieve the required shape and fit.",quick:["Choose a file shape and cut suited to the job.","Always fit a proper handle. Never use an exposed tang.","Secure the workpiece so it cannot move.","With conventional filing, apply cutting pressure on the forward stroke and ease off on the return.","Keep the file clean and check dimensions regularly.","A smooth-looking surface does not prove the part is to size."],basics:[["What is it?","Filing removes small amounts of material using a hardened steel tool with rows of cutting teeth. Hand fitting includes shaping, adjusting and preparing components so they fit and work correctly."],["What does it do?","It removes burrs, smooths edges, adjusts components, produces flat or shaped surfaces and prepares parts for assembly."],["How does it work?","The file teeth cut small chips as the file is pushed across the workpiece. File shape and tooth cut determine the type of work it suits. Other hand-fitting methods include scraping, deburring and checking contact between mating surfaces."],["Where is it used?","Fitting shops, maintenance workshops, toolrooms and manufacturing, particularly where a small controlled adjustment is needed."]],types:"Flat files suit flat surfaces and edges. Half-round files work on flat and curved surfaces. Round files suit holes and internal curves. Square files suit slots and square features. Triangular files suit corners and selected grooves. Single-cut files are often used for smoother work; double-cut files generally remove material more quickly. Rasp-cut files suit selected softer materials. Draw filing holds the file across the work and draws it along the surface. Scraping removes very small high spots for precision fitting.",tools:"Tools include flat, half-round, round, square and triangular files; file cards; scrapers; deburring tools; bench vices; soft jaws or protective packing; engineers' blue; surface plates; straightedges; squares and measuring instruments. Fit a sound handle to the file tang before use.",materials:"Files are selected for the material and required finish. Suitable engineering files are commonly used on mild steel, brass and bronze. Aluminium can clog file teeth, so suitable file selection and cleaning matter. Plastics need appropriate tools and care to avoid heat damage. Hardened steel may not be suitable for conventional filing and may need another process.",process:"1. Check the drawing and required dimensions. 2. Identify the area to be adjusted and the material. 3. Select a suitable file. 4. Secure the workpiece and protect finished surfaces. 5. Check that the file has a proper handle. 6. File with controlled strokes. 7. Clean the file when teeth become clogged. 8. Check dimensions and surface regularly. 9. Deburr and inspect the component. Precision fitting may also involve engineers' blue, a surface plate or a straightedge to identify high spots.",faults:"The wrong file shape makes access difficult and can leave uneven surfaces. Packed teeth scratch the work. Pressure on the return stroke causes unnecessary wear. Poor workholding lets the job move. Filing too aggressively can make the part undersize. A worn file cuts poorly. Filing carelessly across a finished surface can leave scratches.",tips:"Use a separate suitable file for soft materials if loading is a problem. Clean teeth with a file card rather than striking the file against the vice. Keep handles sound and secure. Use vice packing on finished surfaces. Measure as you go. Don't use a file as a lever, hammer or pry bar. For precision fitting, identify high spots before removing material rather than filing at random.",related:"Measuring and marking out; cutting and material preparation; grinding and finishing; machining; assembly and disassembly; limits, fits and tolerances.",technical:"Useful diagrams: file parts including tang, heel, face and point; single-cut versus double-cut teeth; file shapes and uses; filing stroke; draw filing; engineers' blue contact checking; common burrs and edge finishes. Finished dimensions and tolerances must come from the drawing or job specification."}
};
const articleData={
"Rolling element bearings":{cat:"Components & Mechanical Systems",intro:"Bearings support rotating shafts and let them turn while controlling friction and movement.",quick:["Main parts: inner race, outer race, rolling elements and cage.","Common types: deep groove ball, angular contact, cylindrical, spherical and tapered roller.","Check the full bearing designation before ordering or fitting.","Fit, internal clearance and lubrication depend on the application and manufacturer.","Do not transmit fitting force through the rolling elements."],basics:[["What is it?","A rolling element bearing supports a shaft or rotating part. Balls or rollers run between the inner race and outer race, with the cage keeping them spaced apart."],["What does it do?","It supports radial loads, axial loads or a combination of both. The bearing also controls shaft position and helps the assembly rotate smoothly."],["How does it work?","The inner race usually turns with the shaft. Rolling elements travel along the raceways in the inner and outer races. Correct lubrication, fit and clearance are essential. A bearing can feel smooth by hand and still be damaged or unsuitable."],["Where is it used?","Electric motors, pumps, gearboxes, conveyors, fans, machine tools and wheel assemblies."]],types:"Ball bearings suit many general-purpose applications. Angular-contact bearings carry combined loads in a defined direction. Cylindrical roller bearings handle high radial loads. Spherical roller bearings accommodate misalignment within their limits. Tapered roller bearings can carry combined radial and axial loads.",materials:"Bearing rings and rolling elements are commonly made from hardened bearing steel. Other materials and coatings are used for particular environments. Check the manufacturer's designation, load ratings, internal clearance, cage type, seals and lubrication.",install:"Before fitting, check the shaft and housing for burrs, damage, fretting and out-of-round conditions. Confirm the specified fit. Apply force only to the race being fitted: shaft fit means load the inner race; housing fit means load the outer race. Use a suitable press tool or approved induction heater where specified. Never hammer directly on the bearing.",faults:"Common signs include noise, heat, vibration, discolouration, rough rotation, lubricant breakdown and cage damage. Causes can include contamination, incorrect fit, misalignment, overloading, poor lubrication or incorrect handling.",related:"Shafts and housings, seals, retaining devices, lubrication systems, couplings and gearboxes.",technical:"ISO 492 covers rolling bearing dimensional and geometrical tolerances. Confirm the current edition and the bearing manufacturer's data. Do not assume a C3 clearance or a particular fit is correct without checking the application and drawing."},
"Gears and gearboxes":{cat:"Components & Mechanical Systems",intro:"Gears transfer torque and motion between rotating shafts.",quick:["Check gear type, ratio, rotation direction and lubrication requirements.","Inspect tooth contact pattern, backlash and bearing condition.","Never mix gear oils based only on viscosity grade.","Use the gearbox nameplate and manufacturer manual for limits."],basics:[["What is it?","A gear is a toothed component that meshes with another gear to transmit motion and torque. A gearbox is an assembly of gears, shafts, bearings and a housing."],["What does it do?","It changes speed, torque and sometimes direction of rotation. A reduction gearbox trades output speed for increased torque, subject to losses."],["How does it work?","The teeth mesh and transfer load from one gear to the next. Gear size and tooth count determine the speed ratio. Lubrication separates tooth surfaces and carries away heat and wear particles."],["Where is it used?","Conveyors, pumps, cranes, rolling mills, machine tools, vehicles and industrial drives."]],types:"Common types include spur, helical, bevel, worm and planetary gear arrangements. Each has different load capacity, efficiency, noise and shaft layout characteristics.",materials:"Gear materials, heat treatment, tooth quality, backlash and lubrication are application-specific. Check the gearbox nameplate, drawing and manufacturer documentation.",install:"Check alignment, shaft condition, keys, couplings, seals and mounting faces. Fill with the specified lubricant to the correct level. Follow the manufacturer's procedure for run-in and commissioning.",faults:"Noise, overheating, vibration, oil leaks, damaged teeth and metallic debris can point to lubrication problems, overload, misalignment, bearing failure or tooth damage.",related:"Bearings, shafts, couplings, seals, lubrication systems and electric motors.",technical:"Gear geometry and rating standards are application-specific. Use the gearbox manufacturer's data and applicable design standard. Do not set backlash or contact pattern by guesswork."},
"Shafts and mechanical fits":{cat:"Components & Mechanical Systems",intro:"Shafts carry rotating components and transmit torque through a machine.",quick:["Measure journals in more than one position and direction.","Check runout, taper, ovality, keyways and shoulder condition.","Fit selection comes from the drawing and load/application, not habit.","Remove burrs before measuring or assembling."],basics:[["What is it?","A shaft is a rotating or stationary machine element that supports components such as gears, pulleys, sprockets and couplings."],["What does it do?","It transmits torque and supports components while maintaining their alignment and position."],["How does it work?","Loads pass through the shaft as torsion, bending and sometimes axial force. Shoulders, keys, splines, threads and interference fits locate or drive components."],["Where is it used?","Gearboxes, pumps, motors, conveyors, fans, rollers and machine tools."]],types:"Straight shafts, stepped shafts, hollow shafts, splined shafts, crankshafts and flexible shafts are common forms.",materials:"Material and heat treatment depend on torque, bending load, fatigue, wear and corrosion requirements. Follow the drawing for diameter, tolerance, surface finish and material grade.",install:"Inspect the shaft and mating bore. Check dimensions with calibrated equipment. Use the specified assembly method and support components correctly. Avoid heating a component unless the procedure allows it.",faults:"Common problems include wear, fretting, scoring, cracks, bending, keyway damage and fatigue failure. Look for the cause, not just the damaged part.",related:"Bearings, keys, splines, gears, couplings, seals and retaining rings.",technical:"Fits are selected using the drawing and relevant fit system. ISO 286 is commonly used for limits and fits. Confirm the applicable edition and the drawing's stated tolerance."},
"Hydraulic system fundamentals":{cat:"Hydraulic Systems",intro:"A hydraulic system uses pressurised liquid to transmit power and control movement.",quick:["Pressure is force divided by area: p = F ÷ A.","Cylinder force: F = p × A (ideal, before losses).","Flow mainly affects actuator speed; pressure is developed by resistance to flow.","Isolate, depressurise and verify zero stored energy before opening a circuit.","Never use your hand to search for a hydraulic leak."],basics:[["What is it?","A hydraulic system uses oil or another specified fluid to move and control machinery. A pump supplies flow, valves direct and control it, and actuators turn fluid power into movement."],["What does it do?","It produces high forces in a controlled way. You'll find hydraulics where machinery needs lifting, clamping, pressing, steering or controlled movement."],["How does it work?","The pump draws fluid from the reservoir and sends it into the circuit. Valves control where the fluid goes and limit or regulate pressure and flow. The actuator does the work, then fluid returns to the reservoir or continues through the circuit."],["Where is it used?","Mobile plant, presses, injection moulding machines, industrial production lines, lifting equipment and heavy machinery."]],types:"Systems may be open-circuit or closed-circuit, fixed-displacement or variable-displacement, and may use different pump, valve and actuator arrangements.",materials:"Check the specified fluid type and viscosity, pressure rating, flow rating, seal compatibility, hose assembly rating and filtration requirements. Cleanliness matters: contamination can damage pumps and valve clearances.",install:"Identify and isolate every energy source. Lower or mechanically support suspended loads, discharge accumulators using the approved procedure, lock out and tag out, then verify zero pressure. Keep ports capped and components clean. Recommission to the machine procedure.",faults:"Slow movement, drift, overheating, noise, foaming and pressure loss can come from leakage, air ingress, blocked filters, incorrect oil, pump wear, relief valve issues or internal cylinder leakage.",related:"Pumps, motors, cylinders, directional valves, relief valves, filters, accumulators, hoses, reservoirs and coolers.",technical:"ISO 1219 covers fluid power graphical symbols and circuit diagrams. ISO 4413 addresses hydraulic fluid power system safety requirements. Verify current editions and Australian adoption/status before citing them as compliance requirements."},
"Pneumatic system fundamentals":{cat:"Pneumatic Systems",intro:"A pneumatic system uses compressed air to operate machinery and control movement.",quick:["Cylinder force: F = p × A (ideal, before friction and pressure losses).","Air pressure affects available force; flow and valve capacity affect speed.","Drain condensate and maintain air quality as specified.","Isolate and exhaust stored air before disconnecting lines or components.","A pneumatic actuator can still move unexpectedly after electrical power is removed."],basics:[["What is it?","A pneumatic system uses compressed air as its working medium. Compressed air is prepared, controlled through valves and sent to actuators."],["What does it do?","It creates movement for clamping, pushing, lifting, sorting, gripping and automation. Pneumatics are common where clean, quick and repeatable motion is useful."],["How does it work?","A compressor supplies air to a receiver and air preparation equipment. Valves direct air to a cylinder or air motor. Exhaust air leaves through the valve or silencer."],["Where is it used?","Packaging lines, assembly equipment, automation, material handling, machine tools and process plants."]],types:"Common actuators include single-acting and double-acting cylinders, rodless cylinders, rotary actuators and air motors. Valves may be manually, mechanically, electrically or pneumatically operated.",materials:"Check operating pressure, air quality, seal material, cylinder bore and stroke, valve flow capacity, tubing size and temperature range against the equipment specification.",install:"Isolate the supply and exhaust stored air before removing fittings. Support moving loads and check for trapped pressure. Use the correct tube preparation and fitting method. Do not exceed component pressure ratings.",faults:"Slow or weak movement, leakage, water carryover and erratic operation can be caused by low supply pressure, undersized tubing, blocked silencers, poor air quality, damaged seals or incorrect valve operation.",related:"Compressors, receivers, filters, regulators, lubricators, directional valves, cylinders, tubing, silencers and sensors.",technical:"ISO 1219 covers fluid power symbols and circuit diagrams. ISO 4414 addresses pneumatic fluid power system safety requirements. Verify current editions and Australian adoption/status before publication."},
"Engineering drawing interpretation":{cat:"Engineering Drawings & Schematics",intro:"A drawing tells you what to make, inspect, assemble or repair, and what limits the finished job must meet.",quick:["Check drawing number, revision, scale, units and projection method first.","Do not scale a drawing when a dimension is given.","Read general notes, title block, material and finish callouts.","A schematic shows function and connections, not necessarily physical layout."],basics:[["What is it?","An engineering drawing is the controlled information used to manufacture, inspect or assemble a component or machine."],["What does it do?","It communicates shape, size, material, tolerances, surface finish, fits and assembly requirements so different people can produce the same result."],["How does it work?","Views, sections, dimensions, symbols, notes and parts lists describe the component. The title block and revision identify which controlled version you should use."],["Where is it used?","Workshop manufacture, maintenance, installation, inspection, fabrication and machine rebuilds."]],types:"Detail drawings show individual parts. Assembly drawings show how components fit together. Layout drawings show arrangement. Schematics show how a system functions and how components connect.",materials:"Look for material grades, heat treatment, coating, hardness and surface finish notes. Check the revision and any referenced specifications before starting work.",install:"Use the latest approved drawing. Check the part number and revision against the job. Raise unclear or conflicting dimensions before machining or assembly.",faults:"Common traps include using an obsolete revision, confusing first- and third-angle projection, missing a datum, reading a diameter as a radius, overlooking a general tolerance or assuming a schematic is drawn to scale.",related:"Limits and fits, metrology, materials, fasteners, hydraulic schematics and pneumatic schematics.",technical:"For fluid power schematics, ISO 1219 is the key symbol and circuit-diagram reference family. Read the legend first, identify the supply and return/exhaust paths, then follow the circuit through valves to the actuator. Valve boxes show positions; arrows show flow paths; blocked ends show closed ports. Port numbering and symbol conventions must be read from the drawing legend and applicable standard."}
};
function makeGeneric(title,cat){return {cat,intro:`A practical introduction to ${title.toLowerCase()} and where it fits into day-to-day fitting and maintenance work.`,quick:["Start with the drawing, equipment data and manufacturer's instructions.","Use the correct measuring method and calibrated tools.","Check the condition of mating parts before assembly.","Record measurements and report anything outside the specified limits."],basics:[["What is it?",`${title} is part of the knowledge and equipment used to maintain, repair or manufacture industrial machinery.`],["What does it do?","It helps the fitter understand the component, process or requirement and make sound decisions on the job."],["How does it work?","The details depend on the design and application. Work from the drawing, specification and equipment documentation rather than relying on assumptions."],["Where is it used?","Across industrial maintenance, manufacturing, machine shops and plant equipment."]],types:"Different designs and variations suit different loads, materials, environments and operating conditions. Identify the exact type before selecting a method or replacement.",materials:"Material grades, dimensions, tolerances and operating limits must come from the drawing, applicable standard or manufacturer data. Do not guess critical values.",install:"Inspect, clean and measure before assembly. Use the specified tools and procedure. Protect sealing faces, threads and precision surfaces from damage.",faults:"Look for wear, damage, contamination, looseness, misalignment, overheating and signs of incorrect previous work. Find the root cause before replacing parts.",related:"Check the connected components, fasteners, seals, lubrication and supporting structure.",technical:"Use the relevant Australian Standard, AS/NZS adoption or ISO reference where applicable. Confirm the current edition and scope before treating a reference as a requirement."};}
let currentPage="home",currentArticle="",mode="learn",saved=JSON.parse(localStorage.getItem("fb_saved")||"[]"),notes=JSON.parse(localStorage.getItem("fb_notes")||"[]"),searchTerm="";
const allTopics=categories.flatMap(c=>c.topics.map(t=>({title:t,cat:c.name,id:c.id})));
function articleFor(title,cat){return workshopArticles[title]||articleData[title]||makeGeneric(title,cat)}
function navigate(page){currentPage=page;currentArticle="";render();window.scrollTo(0,0)}
function openArticle(title,cat){currentArticle=title;currentPage="article";render();window.scrollTo(0,0)}
function toggleSave(title){saved=saved.includes(title)?saved.filter(x=>x!==title):[...saved,title];localStorage.setItem("fb_saved",JSON.stringify(saved));render()}
function render(){
 document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===currentPage||(currentPage==="article"&&b.dataset.page==="library")));
 const m=document.getElementById("main");
 if(currentPage==="home")m.innerHTML=homePage();
 else if(currentPage==="library")m.innerHTML=libraryPage();
 else if(currentPage==="article")m.innerHTML=articlePage();
 else if(currentPage==="calculators")m.innerHTML=calculatorsPage();
 else if(currentPage==="bookmarks")m.innerHTML=bookmarksPage();
 else if(currentPage==="notes")m.innerHTML=notesPage();
 else if(currentPage==="hydraulics"||currentPage==="pneumatics"||currentPage==="drawings")m.innerHTML=specialPage(currentPage);
}
function homePage(){return `<div class="hero"><div class="eyebrow">The practical engineering reference</div><h1>Know your gear.<br>Understand the job.</h1><p>A workshop-friendly reference for fitters, turners and apprentices. Get your head around the component, understand how it works, then get into the technical detail.</p><div class="hero-meta"><span>Learn and Technical modes</span><span>Workshop-focused references</span><span>Built for mobile</span></div></div><div class="section-head"><div><h2>Explore the library</h2><p>Pick a subject and get straight into it.</p></div><button class="btn" onclick="navigate('library')">View all →</button></div><div class="grid">${categories.map(c=>`<button class="tile" onclick="navigate('${c.id==="hydraulics"?"hydraulics":c.id==="pneumatics"?"pneumatics":c.id==="drawings"?"drawings":"library"}');setTimeout(()=>{const el=document.getElementById('cat-${c.id}');if(el)el.scrollIntoView({behavior:'smooth'})},80)"><div class="tile-icon">${c.icon}</div><h3>${c.name}</h3><p>${c.desc}</p><div class="count">${c.topics.length} topics</div></button>`).join("")}</div><div class="section-head"><div><h2>Popular workshop references</h2><p>Start with the fundamentals.</p></div></div><div class="split"><div class="list">${["Rolling element bearings","Hydraulic system fundamentals","Pneumatic system fundamentals","Engineering drawing interpretation"].map(t=>`<div class="list-item"><button onclick="openArticle('${t}','')"><b>${t}</b><small>Open reference article</small></button><span class="tag">Reference</span></div>`).join("")}</div><div class="panel"><div class="eyebrow">Built for the workshop</div><h3 style="margin:8px 0">Get the basics right first.</h3><p class="muted">Each topic starts with a quick shop-floor reference, then breaks the subject down into plain English before moving into the technical detail.</p><button class="btn gold" onclick="navigate('calculators')">Open calculators</button></div></div><div class="footer">FIT­TERS BIBLE BETA · Technical information is a learning aid, not a substitute for approved procedures, risk assessments, drawings or manufacturer instructions.</div>`}
function libraryPage(){return `<div class="eyebrow">Technical library</div><h1 style="margin:5px 0 4px">The library</h1><p class="muted">Ten reference areas covering the work fitters deal with every day.</p>${categories.map(c=>`<section id="cat-${c.id}"><div class="section-head"><div><h2>${c.icon} ${c.name}</h2><p>${c.desc}</p></div></div><div class="list">${c.topics.map(t=>`<div class="list-item"><button onclick="openArticle('${t.replace(/'/g,"\\'")}','${c.name}')"><b>${t}</b><small>${c.name}</small></button><span class="tag">Open</span></div>`).join("")}</div></section>`).join("")}`}
function articlePage(){const a=articleFor(currentArticle,"");if(a.cat==="Workshop Processes"){return `<div class="article-head"><div><div class="eyebrow">${a.cat}</div><h1>${currentArticle}</h1><p>${a.intro}</p></div><div class="article-actions"><div class="modebar"><button class="${mode==="learn"?"active":""}" onclick="mode='learn';render()">Learn</button><button class="${mode==="technical"?"active":""}" onclick="mode='technical';render()">Technical</button></div><button class="btn" onclick="toggleSave('${currentArticle.replace(/'/g,"\'")}')">${saved.includes(currentArticle)?"★ Saved":"☆ Save"}</button></div></div><div class="panel" style="border-color:#8a6632;margin:16px 0"><b style="color:var(--gold2)">Important: Guide only</b><p class="muted" style="margin:7px 0 0">${workshopDisclaimer}</p></div><div class="quick"><h3>QUICK SHOP-FLOOR REFERENCE</h3><ul>${a.quick.map(x=>`<li>${x}</li>`).join("")}</ul></div><section class="article-section"><h2>1. The Basics</h2>${a.basics.map(([h,p])=>`<div class="learn"><h3>${h}</h3><p>${p}</p></div>`).join("")}</section><section class="article-section"><h2>2. Types and Variations</h2><p class="learn">${a.types}</p><p class="technical">${a.types}</p></section><section class="article-section"><h2>3. Tools and Equipment</h2><p class="learn">${a.tools}</p><p class="technical">${a.tools}</p></section><section class="article-section"><h2>4. Materials and Preparation</h2><p class="learn">${a.materials}</p><p class="technical">${a.materials}</p></section><section class="article-section"><h2>5. General Process Overview</h2><p class="learn">${a.process}</p><p class="technical">${a.process}</p></section><section class="article-section"><h2>6. Common Faults and Mistakes</h2><p class="learn">${a.faults}</p><p class="technical">${a.faults}</p></section><section class="article-section"><h2>7. Workshop Tips</h2><p class="learn">${a.tips}</p><p class="technical">${a.tips}</p></section><section class="article-section"><h2>8. Related Processes</h2><p>${a.related}</p></section><section class="article-section"><h2>9. Technical Diagrams and Reference Information</h2><p class="learn">${a.technical}</p><p class="technical">${a.technical}</p><div class="panel" style="margin-top:12px"><b style="color:var(--gold2)">Workshop reminder</b><p class="muted" style="margin-bottom:0">If a dimension, speed, feed, tolerance, pressure, torque or test limit matters, take it from the approved drawing, current applicable standard, manufacturer documentation and site procedure. Don't fill gaps with a guess.</p></div></section><div class="footer">General learning reference only. Confirm current standards, manufacturer information and site procedures before carrying out work.</div>`;}return `<div class="article-head"><div><div class="eyebrow">${a.cat}</div><h1>${currentArticle}</h1><p>${a.intro}</p></div><div class="article-actions"><div class="modebar"><button class="${mode==="learn"?"active":""}" onclick="mode='learn';render()">Learn</button><button class="${mode==="technical"?"active":""}" onclick="mode='technical';render()">Technical</button></div><button class="btn" onclick="toggleSave('${currentArticle.replace(/'/g,"\\'")}')">${saved.includes(currentArticle)?"★ Saved":"☆ Save"}</button></div></div><div class="quick"><h3>QUICK SHOP-FLOOR REFERENCE</h3><ul>${a.quick.map(x=>`<li>${x}</li>`).join("")}</ul></div><section class="article-section"><h2>1. The Basics</h2>${a.basics.map(([h,p])=>`<div class="learn"><h3>${h}</h3><p>${p}</p></div>`).join("")}</section><section class="article-section"><h2>2. Types and Variations</h2><p class="learn">${a.types}</p><p class="technical">${a.types} Check the equipment documentation for the exact configuration and selection criteria.</p></section><section class="article-section"><h2>3. Materials and Specifications</h2><p class="learn">${a.materials}</p><p class="technical">${a.materials}</p></section><section class="article-section"><h2>4. Installation and Removal</h2><p class="learn">${a.install}</p><p class="technical">${a.install} Record pre- and post-work measurements where required by the job plan.</p></section><section class="article-section"><h2>5. Common Faults and Failures</h2><p class="learn">${a.faults}</p><p class="technical">${a.faults} Use inspection findings and operating history to confirm the failure mechanism before deciding on corrective action.</p></section><section class="article-section"><h2>6. Related Components</h2><p>${a.related}</p></section><section class="article-section"><h2>7. Technical Diagrams and Reference Information</h2><p class="learn">${a.technical}</p><p class="technical">${a.technical}</p><div class="panel" style="margin-top:12px"><b style="color:var(--gold2)">Workshop reminder</b><p class="muted" style="margin-bottom:0">If a dimension, pressure, clearance, fit, torque or test limit matters, take it from the approved drawing, current applicable standard or manufacturer documentation. Don't fill gaps with a guess.</p></div></section><div class="footer">Article content is an introductory beta draft. Standards references and technical limits must be verified before operational use.</div>`}
function specialPage(p){let title=p==="hydraulics"?"Hydraulic Systems":p==="pneumatics"?"Pneumatic Systems":"Engineering Drawings & Schematics";let c=categories.find(x=>x.id===p);return `<div class="eyebrow">Reference area</div><h1>${title}</h1><p class="muted">${c.desc}</p><div class="quick"><h3>START HERE</h3><ul><li>Work from the machine documentation and current approved drawings.</li><li>Understand the energy source, controls, actuator and return or exhaust path.</li><li>Isolate and verify stored energy before disconnecting components.</li></ul></div><div class="list">${c.topics.map(t=>`<div class="list-item"><button onclick="openArticle('${t}','${c.name}')"><b>${t}</b><small>${c.name}</small></button><span class="tag">Open topic</span></div>`).join("")}</div>`}
function calculatorsPage(){return `<div class="eyebrow">Workshop tools</div><h1>Calculators</h1><p class="muted">Quick calculations for common workshop jobs. Results are estimates and must be checked against the job requirements.</p><div class="calc-grid"><div class="panel"><h3>Cutting speed to RPM</h3><p class="muted">Calculate spindle speed from cutting speed and work diameter.</p><div class="field"><label>Cutting speed (m/min)</label><input id="vc" type="number" value="30"></div><div class="field"><label>Work diameter (mm)</label><input id="dia" type="number" value="50"></div><button class="btn gold" onclick="calcRpm()">Calculate RPM</button><div class="result" id="rpmResult">RPM will appear here</div><small class="muted">Formula: n = (Vc × 1000) ÷ (π × D)</small></div><div class="panel"><h3>Metric tap drill estimate</h3><p class="muted">A quick starting estimate for standard metric coarse threads.</p><div class="field"><label>Thread diameter (mm)</label><input id="td" type="number" value="10"></div><div class="field"><label>Thread pitch (mm)</label><input id="tp" type="number" value="1.5"></div><button class="btn gold" onclick="calcTap()">Calculate drill size</button><div class="result" id="tapResult">Drill size will appear here</div><small class="muted">Estimate: nominal diameter minus pitch. Confirm engagement, material and tap manufacturer's recommendation.</small></div><div class="panel"><h3>Hydraulic cylinder force</h3><p class="muted">Ideal extension force, before friction and losses.</p><div class="field"><label>Pressure (bar)</label><input id="hp" type="number" value="100"></div><div class="field"><label>Bore diameter (mm)</label><input id="hb" type="number" value="50"></div><button class="btn gold" onclick="calcHyd()">Calculate force</button><div class="result" id="hydResult">Force will appear here</div><small class="muted">F = p × A. Uses bore area. Retraction force is lower because of the rod area.</small></div><div class="panel"><h3>Unit conversion</h3><p class="muted">Millimetres and inches.</p><div class="field"><label>Millimetres (mm)</label><input id="mm" type="number" value="25.4" oninput="document.getElementById('inch').value=this.value/25.4"></div><div class="field"><label>Inches (in)</label><input id="inch" type="number" value="1" oninput="document.getElementById('mm').value=this.value*25.4"></div><div class="result">1 inch = 25.4 mm exactly</div></div></div>`}
function calcRpm(){let v=+document.getElementById("vc").value,d=+document.getElementById("dia").value;document.getElementById("rpmResult").textContent=v>0&&d>0?Math.round(v*1000/(Math.PI*d))+" RPM":"Enter positive values"}
function calcTap(){let d=+document.getElementById("td").value,p=+document.getElementById("tp").value;document.getElementById("tapResult").textContent=d>p&&p>0?(d-p).toFixed(2)+" mm estimate":"Check diameter and pitch"}
function calcHyd(){let p=+document.getElementById("hp").value,b=+document.getElementById("hb").value;let f=p*1e5*Math.PI*Math.pow(b/2000,2);document.getElementById("hydResult").textContent=p>0&&b>0?(f/1000).toFixed(2)+" kN":"Enter positive values"}
function bookmarksPage(){return `<div class="eyebrow">Your workspace</div><h1>Bookmarks</h1><p class="muted">Your saved references stay in this browser on this device.</p>${saved.length?`<div class="list">${saved.map(t=>`<div class="list-item"><button onclick="openArticle('${t.replace(/'/g,"\\'")}','')"><b>${t}</b><small>Saved reference</small></button><button class="btn" onclick="toggleSave('${t.replace(/'/g,"\\'")}')">Remove</button></div>`).join("")}</div>`:`<div class="empty">No saved articles yet. Open a topic and tap ☆ Save.</div>`}`}
function notesPage(){return `<div class="eyebrow">Your workspace</div><h1>Workshop notes</h1><p class="muted">Keep job notes, measurements and reminders. Notes are stored locally in this browser.</p><div class="panel"><div class="field"><label>Note title</label><input id="noteTitle" placeholder="e.g. Pump coupling inspection"></div><div class="field"><label>Note</label><textarea id="noteBody" rows="4" placeholder="Record measurements, observations or follow-up work..."></textarea></div><button class="btn gold" onclick="addNote()">Save note</button></div><div style="margin-top:16px">${notes.length?notes.map((n,i)=>`<div class="note-card"><b>${escapeHtml(n.title)}</b><small class="muted"> · ${n.date}</small><p>${escapeHtml(n.body)}</p><button class="btn" onclick="deleteNote(${i})">Delete</button></div>`).join(""):`<div class="empty">No workshop notes yet.</div>`}</div>`}
function addNote(){let title=document.getElementById("noteTitle").value.trim(),body=document.getElementById("noteBody").value.trim();if(!title||!body)return alert("Add a title and a note first.");notes.unshift({title,body,date:new Date().toLocaleDateString()});localStorage.setItem("fb_notes",JSON.stringify(notes));render()}
function deleteNote(i){notes.splice(i,1);localStorage.setItem("fb_notes",JSON.stringify(notes));render()}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.getElementById("sideNav").addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b)navigate(b.dataset.page)});
document.getElementById("mobileNav").addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b)navigate(b.dataset.page)});
document.getElementById("search").addEventListener("input",e=>{searchTerm=e.target.value.trim().toLowerCase();if(!searchTerm){if(currentPage==="search")navigate("home");return}currentPage="search";let results=allTopics.filter(t=>t.title.toLowerCase().includes(searchTerm)||t.cat.toLowerCase().includes(searchTerm));document.getElementById("main").innerHTML=`<div class="eyebrow">Library search</div><h1>Search results</h1><p class="muted">${results.length} matching topics</p>${results.length?`<div class="list">${results.map(t=>`<div class="list-item"><button onclick="openArticle('${t.title.replace(/'/g,"\\'")}','${t.cat}')"><b>${t.title}</b><small>${t.cat}</small></button><span class="tag">Open</span></div>`).join("")}</div>`:`<div class="empty">No matches. Try a different search term.</div>`}`});
render();
</script>
</body></html>
